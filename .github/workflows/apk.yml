name: Build APK

# LulaGram CI: builds an arm64 APK on every push to main (or by hand from the Actions tab)
# and attaches it to the run as a downloadable artifact. No Telegram posting, no releases.
#
# Signing: if the repo has the KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD secrets (optional KEY_ALIAS)
# they are used, so every build is signed with the same key and installs over the previous one.
# Without them a throwaway key is generated per run: the APK installs, but a later build signed with a
# different key has to be uninstalled first.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'changelogs/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email ci@lulagram
          git config --global user.name 'lulagram ci'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-arm64-release
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-arm64-release
            ${{ runner.os }}-ndk-27.2-
            ${{ runner.os }}-
          max-size: 5G
          save: true

      # setup applies the patch stack with stgit; install it explicitly instead of trusting the runner image
      - name: Install stgit
        run: |
          command -v stg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends stgit; }
          stg --version

      - name: Set up worktree
        run: bun run setup -- --ci --pluginless

      - name: Compute build info
        id: info
        env:
          PRERELEASE: 'false'
        run: bun run tsx assets/release/version.ts

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-cleanup: always

      - name: Tune Gradle
        run: |
          echo 'org.gradle.caching=true'                                              >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true'                                             >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose'                                   >> ~/.gradle/gradle.properties

      - name: Cache Android NDK & CMake
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.31.6
          key: android-ndk-cmake-27.2.12479018-3.31.6

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            cmake;3.31.6
            ndk;27.2.12479018

      # The gradle build applies the google-services plugin, which only needs the file to exist and match the
      # application id. LulaGram has no Firebase project, so a placeholder is written instead of a secret.
      - name: Write placeholder google-services.json
        run: |
          cat > /tmp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "lulagram-placeholder",
              "storage_bucket": "lulagram-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "ua.entaytion.entinygram" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "ua.entaytion.entinygram.beta" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholder" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cp /tmp/google-services.json worktree-pluginless/TMessagesProj/google-services.json
          cp /tmp/google-services.json worktree-pluginless/TMessagesProj_App/google-services.json

      - name: Install wallet engine Rust targets
        working-directory: worktree-pluginless/TMessagesProj/jni/gram-wallet
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Reset ccache stats
        run: ccache -z

      - name: Build arm64
        working-directory: worktree-pluginless
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: ${{ steps.info.outputs.ver-code }}
          INU_BUILD_TYPE: release
          ABI_FILTERS: arm64-v8a
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/worktree-pluginless
        run: |
          ./gradlew --no-daemon :TMessagesProj_App:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp TMessagesProj_App/build/outputs/apk/release/app.apk "$GITHUB_WORKSPACE/out/unsigned.apk"

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_ALIAS=${KEY_ALIAS:-lulagram}" >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using the keystore from repository secrets"
          else
            pass="$(openssl rand -hex 16)"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storetype PKCS12 \
              -alias lulagram -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=LulaGram CI" -storepass "$pass" -keypass "$pass"
            echo "KS_ALIAS=lulagram" >> "$GITHUB_ENV"
            echo "KS_PASS=$pass" >> "$GITHUB_ENV"
            echo "KS_KEY_PASS=$pass" >> "$GITHUB_ENV"
            echo "::notice::No keystore secrets set, signed with a throwaway key (see the comment at the top of apk.yml)"
          fi

      - name: Sign APK
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          out="out/lulagram-arm64-${{ steps.info.outputs.ver-code }}.apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-type PKCS12 --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_KEY_PASS" \
            --v1-signing-enabled false \
            --in out/unsigned.apk --out "$out"
          "$apksigner" verify --print-certs "$out"
          rm -f out/unsigned.apk "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lulagram-arm64-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
